# =============================================================================
# CD - Destroy Full
# =============================================================================
# Destroi TUDO: infra, Key Pair, artifact do state, EC2 órfãs e SGs órfãos.
# Uso: fim do curso / entrega, para deixar a conta AWS limpa.
#
# Depois deste workflow, a próxima execução do cd-provision vai gerar
# um novo par de chaves SSH — o secret EC2_SSH_KEY precisa ser recadastrado.
#
# Uso: Actions → CD - Destroy Full → Run workflow → confirm: DESTROY-ALL
# =============================================================================
name: CD - Destroy Full

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DESTROY-ALL (maiúsculas) para confirmar'
        required: true
        default: ''

# Token mínimo: só leitura do repositório.
permissions:
  contents: read

concurrency:
  group: destroy
  cancel-in-progress: false

jobs:
  destroy-full:
    name: Destroy everything
    runs-on: ubuntu-latest
    environment: aws

    # Guard mais rígido: exige DESTROY-ALL.
    if: ${{ github.event.inputs.confirm == 'DESTROY-ALL' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Autenticação AWS via secrets do Environment aws.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.5

      # Baixa o state salvo pelo cd-provision.
      - name: Baixar state do Terraform
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: terraform-state
          path: terraform/
        continue-on-error: true

      - name: Verificar se o state existe
        id: check
        working-directory: terraform
        run: |
          if [ -f terraform.tfstate ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "State encontrado."
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "State NÃO encontrado — pulando destroy do Terraform."
          fi

      - name: Terraform init
        if: steps.check.outputs.found == 'true'
        working-directory: terraform
        run: terraform init -input=false

      # 1) Destroy da infraestrutura gerenciada pelo Terraform.
      - name: Terraform destroy
        if: steps.check.outputs.found == 'true'
        working-directory: terraform
        env:
          TF_VAR_aws_region:    ${{ vars.AWS_REGION }}
          TF_VAR_instance_type: ${{ vars.TF_INSTANCE_TYPE }}
          TF_VAR_key_name:      ci-cd-deploy-key
        run: terraform destroy -auto-approve -input=false

      # 2) Remove o Key Pair da AWS.
      - name: Remover Key Pair da AWS
        run: |
          if aws ec2 describe-key-pairs --key-name ci-cd-deploy-key 2>/dev/null; then
            aws ec2 delete-key-pair --key-name ci-cd-deploy-key
            echo "Key Pair ci-cd-deploy-key removido."
          else
            echo "Key Pair já não existia."
          fi

      # 3) Remove EC2 órfãs com a tag do projeto.
      #    Cobre o caso de execuções antigas do provision terem criado
      #    EC2 sem que o state atual saiba.
      - name: Remover EC2 órfãs com a tag do projeto
        run: |
          set -e
          IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ci-cd-app-ec2" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          if [ -n "$IDS" ] && [ "$IDS" != "None" ]; then
            echo "Terminando instâncias órfãs: $IDS"
            aws ec2 terminate-instances --instance-ids $IDS
            aws ec2 wait instance-terminated --instance-ids $IDS
          else
            echo "Nenhuma EC2 órfã encontrada."
          fi

      # 4) Remove Security Groups órfãos com o nome do projeto.
      - name: Remover Security Groups órfãos
        run: |
          set -e
          SGS=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=ci-cd-app-sg" \
            --query 'SecurityGroups[].GroupId' \
            --output text 2>/dev/null || true)
          if [ -z "$SGS" ] || [ "$SGS" = "None" ]; then
            echo "Nenhum SG órfão encontrado."
          else
            for SG in $SGS; do
              aws ec2 delete-security-group --group-id $SG \
                && echo "SG $SG removido." \
                || echo "SG $SG em uso — pulando."
            done
          fi

      # 5) Limpa o artifact do state para o próximo provision começar limpo.
      - name: Remover artifact do state
        uses: geekyeggo/delete-artifact@f275313e70c08f6120db482d7c247f020fe431e0 # v5.0.0
        with:
          name: terraform-state
        continue-on-error: true

      - name: Resumo
        run: |
          {
            echo "### Destroy Full concluído"
            echo ""
            echo "| Item | Status |"
            echo "|---|---|"
            echo "| VPC / subnet / IGW / SG / EC2 | destruídos |"
            echo "| EC2 órfãs | verificadas e removidas |"
            echo "| SG órfãos | verificados e removidos |"
            echo "| Key Pair \`ci-cd-deploy-key\` | **removido** |"
            echo "| Artifact \`terraform-state\` | **removido** |"
            echo "| Secrets / Variables | mantidos |"
            echo ""
            echo "### Próximos passos (uma vez)"
            echo "1. Rode **CD - Provision Infra** — vai gerar um novo par de chaves SSH"
            echo "2. Baixe o novo artifact \`ec2-ssh-key\`"
            echo "3. Sobrescreva o secret \`EC2_SSH_KEY\`"
            echo "4. Atualize a variable \`EC2_PUBLIC_IP\` com o novo IP"
          } >> $GITHUB_STEP_SUMMARY
