# Pipeline de Blue/Green — deploy no slot INATIVO.
# O switch de tráfego é um workflow separado (cd-blue-green-switch.yml).
# Fluxo: build+push da imagem → aplicar base + deployment da cor → smoke no slot.
name: CD - Blue/Green (deploy por cor)

on:
  workflow_dispatch:
    inputs:
      color:
        description: "Cor alvo do deploy"
        type: choice
        options: [blue, green]
        required: true
      image_tag:
        description: "Tag da imagem Docker (deixe 'latest' ou informe um SHA curto)"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: blue-green-deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_TAG: ${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Login GHCR
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6.9.0
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Resumo do build
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo "- Tag: \`${{ env.IMAGE_TAG }}\`"
            echo "- Imagem: \`${{ env.IMAGE_NAME }}\`"
          } >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Deploy na cor ${{ inputs.color }}
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600
