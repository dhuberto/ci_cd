# =============================================================================
# deployment-green.yaml — slot GREEN
# =============================================================================
# APP_COLOR=green faz a interface ficar verde quando o slot está ativo.
# labels slot=green casam com o Service todolist-green e com o selector
# do Service todolist-active (durante o switch).
#
# serviceAccountName: todolist-sa — identidade para a rota /pods.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-green
  namespace: blue-green
  labels:
    app: todolist
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todolist
      slot: green
  template:
    metadata:
      labels:
        app: todolist
        slot: green
    spec:
      # ServiceAccount para a rota /pods consultar a API do k8s.
      serviceAccountName: todolist-sa
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_NAME
              value: "TodoList Green"
            - name: APP_COLOR
              value: "green"
            - name: APP_PORT
              value: "5000"
            - name: SESSION_KEY
              value: "green-session-key"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
