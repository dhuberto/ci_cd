# =============================================================================
# _reusable-test.yml — workflow reutilizável de testes
# =============================================================================
# Chamado por outros workflows via `uses:`. Não dispara sozinho.
# Roda go vet + go test em matrix Go (default: 1.22 e 1.23).
# =============================================================================
name: Reusable test

on:
  workflow_call:
    inputs:
      go-versions:
        description: 'JSON array of Go versions to test against'
        required: false
        type: string
        default: '["1.22", "1.23"]'

jobs:
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        go-version: ${{ fromJSON(inputs.go-versions) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
          cache-dependency-path: go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v ./...
