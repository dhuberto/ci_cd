# =============================================================================
# service.yaml — Service ClusterIP do namespace rolling
# =============================================================================
# Selector `app: app-go` precisa bater com os labels do Deployment.
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: app-go
  namespace: rolling
  labels:
    app: app-go
spec:
  type: ClusterIP
  selector:
    app: app-go
  ports:
    - name: http
      port: 5000
      targetPort: 5000
