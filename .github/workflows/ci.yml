# =============================================================================
# CI — Integração Contínua (Go)
# =============================================================================
# Fluxo:
#   1. Lint + Test em matrix Go 1.25 (gera go.sum antes)
#   2. Security (govulncheck) — gera go.sum antes
#   3. Trivy (filesystem)
#   4. Build (docker build) + Trivy (image)      — condicional
#   5. Publish (build + push no GHCR)            — condicional
#   6. Notify — webhook para o canal do time
#
# O go.sum é gerado em cada job que roda Go direto no runner (test, security).
# O Dockerfile também gera o go.sum se não existir.
#
# Quando os jobs de build/publish rodam:
#   - Em push na main (automático)
#   - Em workflow_dispatch com o input run_build = true
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_build:
        description: 'Executar jobs de build, scan da imagem e publish?'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: app-go
  GO_DEFAULT: '1.25'

jobs:
  # ---------------------------------------------------------------------------
  # Lint + Test — matrix Go
  # ---------------------------------------------------------------------------
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.25']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      # Gera o go.sum ANTES do vet/test. Sem isso, o Go reclama de
      # "missing go.sum entry" ao importar github.com/lib/pq.
      - name: Preparar módulo Go (go mod tidy)
        run: |
          if [ ! -f go.mod ]; then
            printf '%s\n' \
              'module app-go' \
              '' \
              'go 1.25' \
              '' \
              'require github.com/lib/pq v1.10.9' \
              > go.mod
          fi
          go mod tidy
          echo "=== go.mod ==="
          cat go.mod
          echo "=== go.sum ==="
          cat go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v ./...

  # ---------------------------------------------------------------------------
  # Segurança — govulncheck
  # ---------------------------------------------------------------------------
  security:
    name: Dependency audit (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_DEFAULT }}
          cache: false

      # Gera o go.sum ANTES do govulncheck.
      - name: Preparar módulo Go (go mod tidy)
        run: |
          if [ ! -f go.mod ]; then
            printf '%s\n' \
              'module app-go' \
              '' \
              'go 1.25' \
              '' \
              'require github.com/lib/pq v1.10.9' \
              > go.mod
          fi
          go mod tidy

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ---------------------------------------------------------------------------
  # Segurança — Trivy (filesystem)
  # ---------------------------------------------------------------------------
  trivy:
    name: Vulnerability scan (Trivy, filesystem)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-fs-results
          path: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Build — docker build (sem push)
  # ---------------------------------------------------------------------------
  build:
    name: Build image
    needs: [test, security]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_build == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      repo: ${{ steps.image.outputs.repo }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve image reference
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      # O Dockerfile gera o go.sum se não existir (via `go mod tidy`).
      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.10.0
        with:
          context: .
          push: false
          load: true
          build-args: |
            IMAGE_TAGS=${{ steps.image.outputs.repo }}:${{ github.sha }}
          tags: ${{ steps.image.outputs.repo }}:${{ github.sha }}

      - name: Save image as artifact
        run: docker save "${{ steps.image.outputs.repo }}:${{ github.sha }}" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Segurança — Trivy (image)
  # ---------------------------------------------------------------------------
  trivy_image:
    name: Vulnerability scan (Trivy, image)
    needs: build
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_build == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build.outputs.repo }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image-results
          path: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Publish — build + push no GHCR
  # ---------------------------------------------------------------------------
  publish:
    name: Publish image to GHCR
    needs: [test, security, trivy]
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.run_build == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve image reference
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.10.0
        with:
          context: .
          push: true
          build-args: |
            IMAGE_TAGS=${{ steps.image.outputs.repo }}:${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.repo }}:${{ github.sha }}
            ${{ steps.image.outputs.repo }}:latest

      - name: Resumo
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo "- Repo: \`${{ steps.image.outputs.repo }}\`"
            echo "- Tag: \`${{ github.sha }}\`"
            echo "- Latest: \`latest\`"
          } >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------------
  # Notify — webhook para o canal do time
  # ---------------------------------------------------------------------------
  notify:
    name: Notify pipeline result
    needs: [test, security, trivy, build, trivy_image, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}
    steps:
      - name: Compose message
        id: msg
        run: |
          if [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.security.result }}" = "success" ] \
            && [ "${{ needs.trivy.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" != "failure" ] \
            && [ "${{ needs.trivy_image.result }}" != "failure" ] \
            && [ "${{ needs.publish.result }}" != "failure" ]; then
            echo "status=✅ SUCESSO" >> "$GITHUB_OUTPUT"
            echo "color=3066993"    >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ FALHA"  >> "$GITHUB_OUTPUT"
            echo "color=15158332"   >> "$GITHUB_OUTPUT"
          fi

      - name: Send webhook
        if: env.WEBHOOK != ''
        env:
          STATUS: ${{ steps.msg.outputs.status }}
          COLOR: ${{ steps.msg.outputs.color }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.actor }}
          TITLE_SUFFIX: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg title "$STATUS — $TITLE_SUFFIX" \
            --argjson color "$COLOR" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg url "$RUN_URL" \
            '{embeds: [{title: $title, color: $color, fields: [{name: "Branch", value: $branch, inline: true}, {name: "Autor", value: $author, inline: true}], url: $url}]}')
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$WEBHOOK"
