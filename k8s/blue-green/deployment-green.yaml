# =============================================================================
# deployment-green.yaml — slot GREEN
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-green
  namespace: blue-green
  labels:
    app: todolist
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todolist
      slot: green
  template:
    metadata:
      labels:
        app: todolist
        slot: green
    spec:
      serviceAccountName: todolist-sa
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_NAME
              value: "TodoList Green"
            - name: APP_COLOR
              value: "green"
            - name: APP_PORT
              value: "5000"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "appuser"
            - name: DB_PASSWORD
              value: "mudar123"
            - name: DB_NAME
              value: "appdb"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
