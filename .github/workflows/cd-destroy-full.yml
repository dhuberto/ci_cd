# =============================================================================
# CD - Destroy Full
# =============================================================================
# Destroi TUDO: infra, Key Pair, artifact do state, EC2 órfãs, SGs órfãos
# e VPCs órfãs.
#
# Uso: Actions → CD - Destroy Full → Run workflow → confirm: DESTROY-ALL
# =============================================================================
name: CD - Destroy Full

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Digite DESTROY-ALL (maiúsculas) para confirmar'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: destroy
  cancel-in-progress: false

jobs:
  destroy-full:
    name: Destroy everything
    runs-on: ubuntu-latest
    environment: aws

    if: ${{ github.event.inputs.confirm == 'DESTROY-ALL' }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.7.5

      - name: Baixar state do Terraform
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: terraform-state
          path: terraform/
        continue-on-error: true

      - name: Verificar se o state existe
        id: check
        working-directory: terraform
        run: |
          if [ -f terraform.tfstate ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "State encontrado."
          else
            echo "found=false" >> $GITHUB_OUTPUT
            echo "State NÃO encontrado — pulando destroy do Terraform."
          fi

      - name: Terraform init
        if: steps.check.outputs.found == 'true'
        working-directory: terraform
        run: terraform init -input=false

      # TF_VAR_root_volume_size obrigatório por causa da validation no variables.tf.
      - name: Terraform destroy
        if: steps.check.outputs.found == 'true'
        working-directory: terraform
        env:
          TF_VAR_aws_region:        ${{ vars.AWS_REGION }}
          TF_VAR_instance_type:     ${{ vars.TF_INSTANCE_TYPE }}
          TF_VAR_key_name:          ci-cd-deploy-key
          TF_VAR_root_volume_size:  30
        run: terraform destroy -auto-approve -input=false

      # Limpeza extra 1: EC2 órfãs com a tag do projeto.
      - name: Remover EC2 órfãs com a tag do projeto
        run: |
          set -e
          IDS=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=ci-cd-app-ec2" \
                      "Name=instance-state-name,Values=pending,running,stopping,stopped" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)
          if [ -n "$IDS" ] && [ "$IDS" != "None" ]; then
            echo "Terminando instâncias órfãs: $IDS"
            aws ec2 terminate-instances --instance-ids $IDS
            aws ec2 wait instance-terminated --instance-ids $IDS
          else
            echo "Nenhuma EC2 órfã encontrada."
          fi

      # Limpeza extra 2: Key Pair.
      - name: Remover Key Pair da AWS
        run: |
          if aws ec2 describe-key-pairs --key-name ci-cd-deploy-key 2>/dev/null; then
            aws ec2 delete-key-pair --key-name ci-cd-deploy-key
            echo "Key Pair ci-cd-deploy-key removido."
          else
            echo "Key Pair já não existia."
          fi

      # Limpeza extra 3: Security Groups órfãos.
      - name: Remover Security Groups órfãos
        run: |
          set -e
          SGS=$(aws ec2 describe-security-groups \
            --filters "Name=group-name,Values=ci-cd-app-sg" \
            --query 'SecurityGroups[].GroupId' \
            --output text 2>/dev/null || true)
          if [ -z "$SGS" ] || [ "$SGS" = "None" ]; then
            echo "Nenhum SG órfão encontrado."
          else
            for SG in $SGS; do
              aws ec2 delete-security-group --group-id $SG \
                && echo "SG $SG removido." \
                || echo "SG $SG em uso — pulando."
            done
          fi

      # Limpeza extra 4: VPCs órfãs com a tag do projeto.
      - name: Remover VPCs órfãs do projeto
        run: |
          set -e
          VPCS=$(aws ec2 describe-vpcs \
            --filters "Name=tag:Name,Values=ci-cd-app-vpc" \
            --query 'Vpcs[].VpcId' \
            --output text 2>/dev/null || true)
          if [ -z "$VPCS" ] || [ "$VPCS" = "None" ]; then
            echo "Nenhuma VPC órfã encontrada."
          else
            for VPC in $VPCS; do
              echo "Removendo VPC $VPC (com subnet, IGW, route table, SG em cascata)..."
              IGW=$(aws ec2 describe-internet-gateways \
                --filters "Name=attachment.vpc-id,Values=$VPC" \
                --query 'InternetGateways[].InternetGatewayId' \
                --output text 2>/dev/null || true)
              if [ -n "$IGW" ] && [ "$IGW" != "None" ]; then
                for G in $IGW; do
                  aws ec2 detach-internet-gateway --internet-gateway-id $G --vpc-id $VPC || true
                  aws ec2 delete-internet-gateway --internet-gateway-id $G || true
                done
              fi
              SUBNETS=$(aws ec2 describe-subnets \
                --filters "Name=vpc-id,Values=$VPC" \
                --query 'Subnets[].SubnetId' --output text 2>/dev/null || true)
              for S in $SUBNETS; do
                [ "$S" = "None" ] || aws ec2 delete-subnet --subnet-id $S || true
              done
              RTS=$(aws ec2 describe-route-tables \
                --filters "Name=vpc-id,Values=$VPC" \
                --query 'RouteTables[?Associations[0].Main!=`true`].RouteTableId' \
                --output text 2>/dev/null || true)
              for R in $RTS; do
                [ "$R" = "None" ] || aws ec2 delete-route-table --route-table-id $R || true
              done
              aws ec2 delete-vpc --vpc-id $VPC || echo "Não deu para remover $VPC"
            done
          fi

      # Limpeza final: artifact do state.
      - name: Remover artifact do state
        uses: geekyeggo/delete-artifact@v5
        with:
          name: terraform-state
        continue-on-error: true

      - name: Resumo
        run: |
          {
            echo "### Destroy Full concluído"
            echo ""
            echo "| Item | Status |"
            echo "|---|---|"
            echo "| VPC / subnet / IGW / SG / EC2 | destruídos |"
            echo "| EC2 órfãs | verificadas e removidas |"
            echo "| SG órfãos | verificados e removidos |"
            echo "| VPCs órfãs | verificadas e removidas |"
            echo "| Key Pair | removido |"
            echo "| Artifact do state | removido |"
          } >> $GITHUB_STEP_SUMMARY
