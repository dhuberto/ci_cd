# Slot GREEN. Idêntico ao BLUE exceto por APP_COLOR=green e labels slot=green.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-green
  namespace: blue-green
  labels:
    app: todolist
    slot: green
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todolist
      slot: green
  template:
    metadata:
      labels:
        app: todolist
        slot: green
    spec:
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_NAME
              value: "TodoList Green"
            - name: APP_COLOR
              value: "green"
            - name: APP_PORT
              value: "5000"
            - name: SESSION_KEY
              value: "green-session-key"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
