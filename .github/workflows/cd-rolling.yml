# =============================================================================
# CD - Rolling Update
# =============================================================================
# Fluxo:
#   1. Build + push da imagem para o GHCR
#   2. SSH na EC2
#   3. Cria imagePullSecret no namespace rolling (a imagem é privada)
#   4. Aplica os manifestos (deployment + service + ingress)
#   5. Aguarda rollout
#   6. Smoke test via Ingress
#
# Uso: Actions → CD - Rolling Update → Run workflow → image_tag: latest
# =============================================================================
name: CD - Rolling Update

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag da imagem (deixe 'latest' para usar o SHA do commit)"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: rolling-${{ github.ref }}
  cancel-in-progress: false

env:
  # Se image_tag for 'latest', usa o SHA do commit. Caso contrário, usa o valor.
  IMAGE_TAG: ${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}
  IMAGE_NAME: ghcr.io/${{ github.repository }}:${{ inputs.image_tag == 'latest' && github.sha || inputs.image_tag }}

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # Login no GHCR com GITHUB_TOKEN (não precisa de secret extra).
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}

      - name: Resumo do build
        run: |
          {
            echo "### Imagem publicada"
            echo ""
            echo "- Tag: \`${{ env.IMAGE_TAG }}\`"
            echo "- Imagem: \`${{ env.IMAGE_NAME }}\`"
          } >> $GITHUB_STEP_SUMMARY

  deploy:
    name: Rolling deploy
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: aws
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar chave SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Renderizar manifesto com a imagem
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|${{ env.IMAGE_NAME }}|g" k8s/rolling/deployment.yaml

      - name: Copiar manifestos
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} "mkdir -p ~/rolling"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            k8s/rolling/*.yaml \
            ec2-user@${{ vars.EC2_PUBLIC_IP }}:/home/ec2-user/rolling/

      # Cria/atualiza o imagePullSecret no namespace rolling.
      # Sem isso, o kubelet não consegue puxar a imagem privada do GHCR.
      - name: Criar imagePullSecret no namespace rolling
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            "/usr/local/bin/kubectl -n rolling create secret docker-registry ghcr-secret \
               --docker-server=ghcr.io \
               --docker-username=${{ github.actor }} \
               --docker-password=${{ secrets.GITHUB_TOKEN }} \
               --dry-run=client -o yaml | /usr/local/bin/kubectl apply -f -"

      # Caminho absoluto do kubectl: o SSH não-interativo não carrega
      # /etc/profile.d/, então 'kubectl' puro dá 'command not found'.
      - name: Aplicar e aguardar rollout
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ec2-user@${{ vars.EC2_PUBLIC_IP }} \
            '/usr/local/bin/kubectl apply -f /home/ec2-user/rolling/ && \
             /usr/local/bin/kubectl -n rolling rollout status deploy/todolist --timeout=180s'

      - name: Smoke test
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Host: rolling.local" \
              http://${{ vars.EC2_PUBLIC_IP }}/healthz || true)
            if [ "$code" = "200" ]; then
              echo "Smoke OK (tentativa $i)"
              exit 0
            fi
            echo "tentativa $i — code=$code"
            sleep 5
          done
          echo "Smoke test falhou" >&2
          exit 1
