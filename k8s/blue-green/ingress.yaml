# =============================================================================
# ingress.yaml — Ingress do Blue/Green (todolist.local)
# =============================================================================
# Aponta sempre para o Service `app-go-active`.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-go
  namespace: blue-green
spec:
  ingressClassName: nginx
  rules:
    - host: todolist.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-go-active
                port:
                  number: 5000
