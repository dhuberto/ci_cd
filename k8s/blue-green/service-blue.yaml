# =============================================================================
# service-blue.yaml — Service ClusterIP do slot blue
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: app-go-blue
  namespace: blue-green
  labels:
    app: app-go
    slot: blue
spec:
  type: ClusterIP
  selector:
    app: app-go
    slot: blue
  ports:
    - name: http
      port: 5000
      targetPort: 5000
