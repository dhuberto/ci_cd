# =============================================================================
# ansible.cfg — configuração global do Ansible
# =============================================================================
# O inventário NÃO é definido aqui porque o workflow passa o host inline
# via `-i "$EC2_IP,"`. Isso evita depender de script executável, o que
# não funciona no GitHub Actions (o runner não preserva bit de execução
# quando o arquivo é criado/editado via GitHub Web).
# =============================================================================

[defaults]
host_key_checking  = False
remote_user        = ec2-user
private_key_file   = ~/.ssh/deploy_key
interpreter_python = auto_silent
