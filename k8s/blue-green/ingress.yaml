# Ingress do Blue/Green: aponta SEMPRE para o Service active,
# e é o switch do selector do active que muda a cor em produção.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: todolist
  namespace: blue-green
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: todolist.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: todolist-active
                port:
                  number: 5000
