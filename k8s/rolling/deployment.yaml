# =============================================================================
# deployment.yaml — Deployment do Rolling Update
# =============================================================================
# 3 réplicas, RollingUpdate, porta 5000. Conecta no Postgres via envs DB_*.
# A imagem IMAGE_PLACEHOLDER é substituída pelo workflow a cada deploy.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-go
  namespace: rolling
  labels:
    app: app-go
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: app-go
  template:
    metadata:
      labels:
        app: app-go
    spec:
      serviceAccountName: app-go-sa
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_NAME
              value: "APP-GO Rolling"
            - name: APP_COLOR
              value: "purple"
            - name: APP_PORT
              value: "5000"
            - name: DB_HOST
              value: "postgres"
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              value: "appuser"
            - name: DB_PASSWORD
              value: "mudar123"
            - name: DB_NAME
              value: "appdb"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
