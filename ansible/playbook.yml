---
# =============================================================================
# playbook.yml — configura a EC2 para receber deploys
# =============================================================================
# Usa hosts: all porque o inventário é passado inline pelo workflow
# (`ansible-playbook -i "${EC2_IP}," playbook.yml`), que cria apenas o grupo
# implícito "all" com o host único. O grupo "ec2" só existiria se usássemos
# o inventory.sh — que foi removido por não funcionar no GitHub Actions.
#
# Ordem das tarefas:
#   1. Docker (fallback se user_data falhou)
#   2. ec2-user no grupo docker
#   3. Instalar kind em /usr/local/bin
#   4. Instalar kubectl em /usr/local/bin (versão fixa)
#   5. Criar kind-config.yaml
#   6. Criar cluster kind (idempotente)
#   7. Aplicar ingress-nginx
#   8. Criar namespaces rolling e blue-green
# =============================================================================

- name: Configurar EC2 para o lab de CD
  hosts: all
  gather_facts: true
  become: false

  vars:
    kind_version: "v0.24.0"
    kind_cluster_name: "devops-labs"
    kubectl_version: "v1.31.0"

  tasks:
    # =========================================================================
    # 1) Docker — verifica e instala se necessário
    # =========================================================================
    - name: Verificar se docker existe
      command: docker --version
      register: docker_check
      failed_when: false
      changed_when: false

    - name: Instalar docker (fallback se user_data falhou)
      become: true
      dnf:
        name: docker
        state: present
        allowerasing: true
      when: docker_check.rc != 0

    - name: Garantir docker habilitado e rodando
      become: true
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Garantir que o ec2-user está no grupo docker
      become: true
      user:
        name: ec2-user
        groups: docker
        append: true

    # =========================================================================
    # 2) kind — instala em /usr/local/bin
    # =========================================================================
    - name: Instalar kind em /usr/local/bin
      become: true
      get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: /usr/local/bin/kind
        mode: "0755"
        force: true

    - name: Verificar kind instalado
      stat:
        path: /usr/local/bin/kind
      register: kind_bin

    - name: Falhar se kind não existe
      fail:
        msg: "kind não foi instalado em /usr/local/bin/kind"
      when: not kind_bin.stat.exists

    # =========================================================================
    # 3) kubectl — versão fixa, caminho absoluto
    # =========================================================================
    - name: Instalar kubectl em /usr/local/bin
      become: true
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
        force: true

    - name: Verificar kubectl instalado
      stat:
        path: /usr/local/bin/kubectl
      register: kubectl_bin

    - name: Falhar se kubectl não existe
      fail:
        msg: "kubectl não foi instalado em /usr/local/bin/kubectl"
      when: not kubectl_bin.stat.exists

    - name: Confirmar que kubectl executa
      command: /usr/local/bin/kubectl version --client
      register: kubectl_check
      changed_when: false

    - name: Mostrar versão do kubectl
      debug:
        msg: "{{ kubectl_check.stdout_lines }}"

    # =========================================================================
    # 4) kind-config.yaml — expõe as portas 80/443 do nó para o ingress
    # =========================================================================
    - name: Criar kind-config.yaml
      copy:
        dest: /home/ec2-user/kind-config.yaml
        owner: ec2-user
        group: ec2-user
        mode: "0644"
        content: |
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            apiServerAddress: "0.0.0.0"
            apiServerPort: 6443
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - { containerPort: 80,  hostPort: 80,  protocol: TCP }
                - { containerPort: 443, hostPort: 443, protocol: TCP }

    # =========================================================================
    # 5) Cluster kind — idempotente
    # =========================================================================
    - name: Verificar se o cluster kind já existe
      command: /usr/local/bin/kind get clusters
      register: kind_clusters
      failed_when: false
      changed_when: false

    - name: Criar cluster kind
      command: >
        /usr/local/bin/kind create cluster
        --name {{ kind_cluster_name }}
        --config /home/ec2-user/kind-config.yaml
      when: kind_cluster_name not in kind_clusters.stdout

    - name: Aguardar o nó ficar Ready
      command: /usr/local/bin/kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false

    # =========================================================================
    # 6) ingress-nginx — expõe o Ingress na porta 80 do nó
    # =========================================================================
    - name: Aplicar manifest do ingress-nginx (kind)
      command: >
        /usr/local/bin/kubectl apply -f
        https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

    - name: Aguardar ingress-nginx
      command: >
        /usr/local/bin/kubectl wait --namespace ingress-nginx
        --for=condition=ready pod
        --selector=app.kubernetes.io/component=controller
        --timeout=240s
      changed_when: false

    # =========================================================================
    # 7) Namespaces — rolling e blue-green
    # =========================================================================
    - name: Criar namespaces do lab
      command: /usr/local/bin/kubectl create ns {{ item }}
      register: ns_create
      failed_when: >
        ns_create.rc != 0 and
        'already exists' not in (ns_create.stderr | default(''))
      changed_when: ns_create.rc == 0
      loop:
        - rolling
        - blue-green

    # =========================================================================
    # 8) Log final — ajuda a debugar no log do Actions
    # =========================================================================
    - name: Mostrar nodes
      command: /usr/local/bin/kubectl get nodes -o wide
      register: nodes_out
      changed_when: false

    - name: Output nodes
      debug:
        msg: "{{ nodes_out.stdout_lines }}"
