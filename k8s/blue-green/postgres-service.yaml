# =============================================================================
# postgres-service.yaml — Service headless (namespace blue-green)
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: blue-green
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
