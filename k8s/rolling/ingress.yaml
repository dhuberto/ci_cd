# =============================================================================
# ingress.yaml — Ingress que expõe rolling.local
# =============================================================================
# O backend aponta para o Service `app-go` do namespace rolling.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-go
  namespace: rolling
spec:
  ingressClassName: nginx
  rules:
    - host: rolling.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-go
                port:
                  number: 5000
