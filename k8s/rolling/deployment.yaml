# =============================================================================
# deployment.yaml — Deployment do Rolling Update
# =============================================================================
# 3 réplicas com strategy RollingUpdate. A imagem IMAGE_PLACEHOLDER é
# substituída pelo workflow a cada deploy.
#
# serviceAccountName: todolist-sa — o pod usa essa ServiceAccount para
# falar com a API do k8s (rota /pods). A ServiceAccount e a Role são
# criadas pelo rbac.yaml.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist
  namespace: rolling
  labels:
    app: todolist
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: todolist
  template:
    metadata:
      labels:
        app: todolist
    spec:
      # ServiceAccount para a rota /pods consultar a API do k8s.
      serviceAccountName: todolist-sa
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_NAME
              value: "TodoList Rolling"
            - name: APP_COLOR
              value: "purple"
            - name: APP_PORT
              value: "5000"
            - name: SESSION_KEY
              value: "rolling-session-key"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
