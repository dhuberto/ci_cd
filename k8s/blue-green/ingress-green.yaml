# =============================================================================
# ingress-green.yaml — Ingress dedicado ao slot GREEN
# =============================================================================
# Acessa o slot green diretamente, sem depender do switch.
# Host: app-go-verde.local
# Backend: Service app-go-green (ClusterIP do slot green)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-go-green-temp
  namespace: blue-green
spec:
  ingressClassName: nginx
  rules:
    - host: app-go-verde.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-go-green
                port:
                  number: 5000
