# =============================================================================
# ingress-blue.yaml — Ingress dedicado ao slot BLUE
# =============================================================================
# Acessa o slot blue diretamente, sem depender do switch.
# Host: app-go-azul.local
# Backend: Service app-go-blue (ClusterIP do slot blue)
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-go-blue-temp
  namespace: blue-green
spec:
  ingressClassName: nginx
  rules:
    - host: app-go-azul.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-go-blue
                port:
                  number: 5000
