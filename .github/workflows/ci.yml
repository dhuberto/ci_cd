# =============================================================================
# CI — Integração Contínua (Go)
# =============================================================================
# Fluxo:
#   1. Prepara o módulo Go (gera go.sum se não existir, valida go.mod)
#   2. Lint + Test em matrix Go 1.22/1.23
#   3. Security (govulncheck)
#   4. Trivy (filesystem)
#   5. Build (docker build, sem push) + Trivy (image)
#   6. Publish (push no GHCR) — só em push na main
#   7. Notify — webhook para o canal do time
#
# Gatilhos: push na main, PR para main, workflow_dispatch
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: app-go
  GO_DEFAULT: '1.22'

jobs:
  # ---------------------------------------------------------------------------
  # Lint + Test — matrix Go
  # ---------------------------------------------------------------------------
  test:
    name: Test (Go ${{ matrix.go-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.22', '1.23']
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ matrix.go-version }}
          cache: false      # desligado porque o go.sum pode não existir

      # Gera o go.sum (se o código existir) e valida o go.mod.
      # Se o go.mod não estiver na raiz, cria um mínimo.
      # O `cat go.sum` é protegido por `if [ -f go.sum ]` para não falhar
      # quando ainda não há código-fonte em ./src.
      - name: Preparar módulo Go (go mod tidy)
        run: |
          if [ ! -f go.mod ]; then
            echo "go.mod não encontrado. Criando um mínimo..."
            cat > go.mod <<'EOF'
          module app-go

          go 1.22

          require github.com/lib/pq v1.10.9
          EOF
          fi
          go mod tidy
          echo "=== go.mod ==="
          cat go.mod
          echo "=== go.sum ==="
          if [ -f go.sum ]; then
            cat go.sum
          else
            echo "(go.sum ainda não foi criado — sem código-fonte em ./src)"
          fi
          echo "=== arquivos .go encontrados ==="
          find . -name "*.go" -not -path "./vendor/*"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v ./...

  # ---------------------------------------------------------------------------
  # Segurança — govulncheck
  # ---------------------------------------------------------------------------
  security:
    name: Dependency audit (govulncheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_DEFAULT }}
          cache: false

      - name: Preparar módulo Go (go mod tidy)
        run: |
          if [ ! -f go.mod ]; then
            cat > go.mod <<'EOF'
          module app-go

          go 1.22

          require github.com/lib/pq v1.10.9
          EOF
          fi
          go mod tidy

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ---------------------------------------------------------------------------
  # Segurança — Trivy (filesystem)
  # ---------------------------------------------------------------------------
  trivy:
    name: Vulnerability scan (Trivy, filesystem)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-fs

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-fs-results
          path: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Build — docker build (sem push)
  # ---------------------------------------------------------------------------
  build:
    name: Build image
    needs: [test, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      repo: ${{ steps.image.outputs.repo }}
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Go
        uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: ${{ env.GO_DEFAULT }}
          cache: false

      # Gera o go.sum ANTES do docker build (o Dockerfile copia go.mod + go.sum)
      - name: Preparar módulo Go (go mod tidy)
        run: |
          if [ ! -f go.mod ]; then
            cat > go.mod <<'EOF'
          module app-go

          go 1.22

          require github.com/lib/pq v1.10.9
          EOF
          fi
          go mod tidy

      - name: Resolve image reference
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          repo="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/$IMAGE_NAME"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.10.0
        with:
          context: .
          push: false
          load: true
          build-args: |
            IMAGE_TAGS=${{ steps.image.outputs.repo }}:${{ github.sha }}
          tags: ${{ steps.image.outputs.repo }}:${{ github.sha }}

      - name: Save image as artifact
        run: docker save "${{ steps.image.outputs.repo }}:${{ github.sha }}" -o image.tar

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Segurança — Trivy (image)
  # ---------------------------------------------------------------------------
  trivy_image:
    name: Vulnerability scan (Trivy, image)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Run Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ needs.build.outputs.repo }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
          format: sarif
          output: trivy-results.sarif

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-image-results
          path: trivy-results.sarif

  # ---------------------------------------------------------------------------
  # Publish — push no GHCR (só em push na main)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish image to GHCR
    needs: [test, security, trivy, build, trivy_image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docker-image

      - name: Load image
        run: docker load -i image.tar

      - name: Tag image as latest
        run: docker tag "${{ needs.build.outputs.repo }}:${{ github.sha }}" "${{ needs.build.outputs.repo }}:latest"

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: |
          docker push "${{ needs.build.outputs.repo }}:${{ github.sha }}"
          docker push "${{ needs.build.outputs.repo }}:latest"

  # ---------------------------------------------------------------------------
  # Notify — webhook para o canal do time
  # ---------------------------------------------------------------------------
  notify:
    name: Notify pipeline result
    needs: [test, security, trivy, build, trivy_image, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK_URL }}
    steps:
      # Monta a mensagem conforme o resultado dos jobs
      - name: Compose message
        id: msg
        run: |
          if [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.security.result }}" = "success" ] \
            && [ "${{ needs.trivy.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" != "failure" ] \
            && [ "${{ needs.trivy_image.result }}" != "failure" ] \
            && [ "${{ needs.publish.result }}" != "failure" ]; then
            echo "status=✅ SUCESSO" >> "$GITHUB_OUTPUT"
            echo "color=3066993"    >> "$GITHUB_OUTPUT"
          else
            echo "status=❌ FALHA"  >> "$GITHUB_OUTPUT"
            echo "color=15158332"   >> "$GITHUB_OUTPUT"
          fi

      # Envia o payload JSON para o webhook configurado
      - name: Send webhook
        if: env.WEBHOOK != ''
        env:
          STATUS: ${{ steps.msg.outputs.status }}
          COLOR: ${{ steps.msg.outputs.color }}
          BRANCH: ${{ github.ref_name }}
          AUTHOR: ${{ github.actor }}
          TITLE_SUFFIX: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          payload=$(jq -n \
            --arg title "$STATUS — $TITLE_SUFFIX" \
            --argjson color "$COLOR" \
            --arg branch "$BRANCH" \
            --arg author "$AUTHOR" \
            --arg url "$RUN_URL" \
            '{embeds: [{title: $title, color: $color, fields: [{name: "Branch", value: $branch, inline: true}, {name: "Autor", value: $author, inline: true}], url: $url}]}')
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "$payload" "$WEBHOOK"
