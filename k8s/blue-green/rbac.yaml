# =============================================================================
# rbac.yaml — ServiceAccount + Role + RoleBinding (namespace blue-green)
# =============================================================================
# A ServiceAccount `app-go-sa` é referenciada pelos Deployments
# app-go-blue e app-go-green.
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-go-sa
  namespace: blue-green
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-go-pods-reader
  namespace: blue-green
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-go-pods-reader-binding
  namespace: blue-green
subjects:
  - kind: ServiceAccount
    name: app-go-sa
    namespace: blue-green
roleRef:
  kind: Role
  name: app-go-pods-reader
  apiGroup: rbac.authorization.k8s.io
