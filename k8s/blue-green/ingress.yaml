# =============================================================================
# ingress.yaml — Ingress do Blue/Green
# =============================================================================
# Host: app-go.local
# Backend: Service `app-go-active` do namespace blue-green.
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-go
  namespace: blue-green
spec:
  ingressClassName: nginx
  rules:
    - host: app-go.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-go-active
                port:
                  number: 5000
