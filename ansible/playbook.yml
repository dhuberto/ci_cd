---
# Playbook responsável por deixar a EC2 pronta para receber deploys.
# Ordem: docker group → kind → kubectl → kind-config → cluster kind →
# ingress-nginx → namespaces rolling e blue-green.
- name: Configurar EC2 para o lab de CD
  hosts: ec2
  gather_facts: true
  become: false
  vars:
    kind_version: "v0.24.0"
    kind_cluster_name: "devops-labs"
    k8s_stable_url: "https://dl.k8s.io/release/stable.txt"

  tasks:
    # Garante que o ec2-user pode falar com o Docker sem sudo.
    - name: Adicionar ec2-user ao grupo docker
      become: true
      user:
        name: ec2-user
        groups: docker
        append: true

    # kind cria clusters Kubernetes dentro de containers Docker.
    - name: Instalar kind
      become: true
      get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: /usr/local/bin/kind
        mode: "0755"

    # Descobre a versão estável do kubectl para baixar o binário certo.
    - name: Descobrir versão estável do kubectl
      uri:
        url: "{{ k8s_stable_url }}"
        return_content: true
      register: k8s_version

    # kubectl é o cliente que o workflow usa via SSH para aplicar manifestos.
    - name: Instalar kubectl
      become: true
      get_url:
        url: "https://dl.k8s.io/release/{{ k8s_version.content | trim }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"

    # Config do kind: expõe a API em 6443 e as portas 80/443 do nó
    # para que o ingress-nginx responda diretamente no IP da EC2.
    - name: Criar kind-config.yaml
      copy:
        dest: /home/ec2-user/kind-config.yaml
        owner: ec2-user
        group: ec2-user
        mode: "0644"
        content: |
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            apiServerAddress: "0.0.0.0"
            apiServerPort: 6443
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - { containerPort: 80,  hostPort: 80,  protocol: TCP }
                - { containerPort: 443, hostPort: 443, protocol: TCP }

    # Evita recriar o cluster a cada execução do playbook.
    - name: Verificar se o cluster kind já existe
      shell: |
        export PATH=$PATH:/usr/local/bin
        kind get clusters 2>/dev/null | grep -q '^{{ kind_cluster_name }}$'
      register: kind_exists
      failed_when: false
      changed_when: false

    # Cria o cluster apenas se ainda não existir.
    - name: Criar cluster kind
      shell: |
        export PATH=$PATH:/usr/local/bin
        kind create cluster --name {{ kind_cluster_name }} --config /home/ec2-user/kind-config.yaml
      when: kind_exists.rc != 0

    # Espera o nó do cluster ficar Ready antes de seguir.
    - name: Aguardar o nó ficar Ready
      shell: |
        export PATH=$PATH:/usr/local/bin
        kubectl wait --for=condition=Ready node --all --timeout=180s

    # ingress-nginx: ponto único de entrada HTTP do cluster.
    - name: Aplicar manifest do ingress-nginx (kind)
      shell: |
        export PATH=$PATH:/usr/local/bin
        kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

    # Espera o controller do ingress-nginx estar pronto.
    - name: Aguardar ingress-nginx
      shell: |
        export PATH=$PATH:/usr/local/bin
        kubectl wait --namespace ingress-nginx \
          --for=condition=ready pod \
          --selector=app.kubernetes.io/component=controller \
          --timeout=240s

    # Namespaces onde Rolling e Blue/Green vão viver.
    - name: Criar namespaces do lab
      shell: |
        export PATH=$PATH:/usr/local/bin
        kubectl create ns rolling    --dry-run=client -o yaml | kubectl apply -f -
        kubectl create ns blue-green --dry-run=client -o yaml | kubectl apply -f -

    # Log útil no final do job para o aluno ver que o cluster subiu.
    - name: Mostrar nodes
      shell: |
        export PATH=$PATH:/usr/local/bin
        kubectl get nodes -o wide
      register: nodes_out
      changed_when: false

    - name: Output nodes
      debug:
        msg: "{{ nodes_out.stdout_lines }}"
