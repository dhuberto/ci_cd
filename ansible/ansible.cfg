# =============================================================================
# ansible.cfg — configuração global do Ansible
# =============================================================================
# Lido automaticamente quando o ansible-playbook é executado dentro de ansible/.
#
# - host_key_checking=False: evita prompt interativo na primeira conexão
# - inventory=./inventory.sh: usa o script dinâmico que gera o inventory
# - remote_user=ec2-user: usuário padrão da AMI Amazon Linux 2023
# - private_key_file: chave gerada pelo workflow cd-provision.yml
# =============================================================================

[defaults]
host_key_checking = False
inventory         = ./inventory.sh
remote_user       = ec2-user
private_key_file  = ~/.ssh/deploy_key
interpreter_python = auto_silent
