# =============================================================================
# rbac.yaml — ServiceAccount + Role + RoleBinding (namespace blue-green)
# =============================================================================
# Mesma função do rbac.yaml do rolling, mas no namespace blue-green.
# Permite que os pods todolist-blue e todolist-green consultem a API
# do Kubernetes para a rota /pods.
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: todolist-sa
  namespace: blue-green
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: todolist-pods-reader
  namespace: blue-green
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: todolist-pods-reader-binding
  namespace: blue-green
subjects:
  - kind: ServiceAccount
    name: todolist-sa
    namespace: blue-green
roleRef:
  kind: Role
  name: todolist-pods-reader
  apiGroup: rbac.authorization.k8s.io
