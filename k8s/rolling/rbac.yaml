# =============================================================================
# rbac.yaml — ServiceAccount + Role + RoleBinding (namespace rolling)
# =============================================================================
# A ServiceAccount `app-go-sa` é referenciada pelo Deployment em rolling.
# Escopo mínimo: Role (namespace-scoped), só "get" e "list" em pods e
# namespaces.
# =============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-go-sa
  namespace: rolling
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: app-go-pods-reader
  namespace: rolling
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-go-pods-reader-binding
  namespace: rolling
subjects:
  - kind: ServiceAccount
    name: app-go-sa
    namespace: rolling
roleRef:
  kind: Role
  name: app-go-pods-reader
  apiGroup: rbac.authorization.k8s.io
