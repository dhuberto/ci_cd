---
# =============================================================================
# playbook.yml — configura a EC2 para receber deploys
# =============================================================================
# Usa hosts: all porque o inventário é passado inline pelo workflow.
#
# Docker:
#   - Limpa cache do DNF (execuções anteriores podem deixar resíduo)
#   - Verifica se `docker` existe no PATH (não depende do systemd)
#   - Se não existe, instala com --allowerasing (resolve curl/curl-minimal)
#   - Só depois pede ao systemd para habilitar/iniciar
#
# kind/kubectl/namespaces rodam como root (become: true), o que evita o
# problema de permission denied no docker.sock (o ec2-user acabou de ser
# adicionado ao grupo docker, mas o grupo só vale em novas sessões SSH).
#
# No fim, o kubeconfig do root é copiado para o ec2-user.
# =============================================================================

- name: Configurar EC2 para o lab de CD
  hosts: all
  gather_facts: true
  become: false

  vars:
    kind_version: "v0.24.0"
    kind_cluster_name: "devops-labs"
    kubectl_version: "v1.31.0"

  tasks:
    # =========================================================================
    # 1) Limpar cache do DNF
    # =========================================================================
    - name: Limpar cache do DNF
      become: true
      command: dnf clean all
      changed_when: false

    # =========================================================================
    # 2) Docker — verifica o binário, instala se necessário
    # =========================================================================
    # `which docker` não falha se não achar (failed_when: false).
    # O rc é 0 se achou, != 0 se não achou.
    - name: Verificar se o binário docker existe
      command: which docker
      register: docker_bin
      failed_when: false
      changed_when: false

    - name: Instalar docker se não existe
      become: true
      dnf:
        name: docker
        state: present
        allowerasing: true
      when: docker_bin.rc != 0

    - name: Garantir docker habilitado e rodando
      become: true
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Garantir que o ec2-user está no grupo docker
      become: true
      user:
        name: ec2-user
        groups: docker
        append: true

    # =========================================================================
    # 3) kind
    # =========================================================================
    - name: Instalar kind em /usr/local/bin
      become: true
      get_url:
        url: "https://kind.sigs.k8s.io/dl/{{ kind_version }}/kind-linux-amd64"
        dest: /usr/local/bin/kind
        mode: "0755"
        force: true

    - name: Verificar kind instalado
      stat:
        path: /usr/local/bin/kind
      register: kind_bin

    - name: Falhar se kind não existe
      fail:
        msg: "kind não foi instalado em /usr/local/bin/kind"
      when: not kind_bin.stat.exists

    # =========================================================================
    # 4) kubectl
    # =========================================================================
    - name: Instalar kubectl em /usr/local/bin
      become: true
      get_url:
        url: "https://dl.k8s.io/release/{{ kubectl_version }}/bin/linux/amd64/kubectl"
        dest: /usr/local/bin/kubectl
        mode: "0755"
        force: true

    - name: Verificar kubectl instalado
      stat:
        path: /usr/local/bin/kubectl
      register: kubectl_bin

    - name: Falhar se kubectl não existe
      fail:
        msg: "kubectl não foi instalado em /usr/local/bin/kubectl"
      when: not kubectl_bin.stat.exists

    - name: Confirmar que kubectl executa
      become: true
      command: /usr/local/bin/kubectl version --client
      register: kubectl_check
      changed_when: false

    - name: Mostrar versão do kubectl
      debug:
        msg: "{{ kubectl_check.stdout_lines }}"

    # =========================================================================
    # 5) kind-config.yaml
    # =========================================================================
    - name: Criar kind-config.yaml
      copy:
        dest: /home/ec2-user/kind-config.yaml
        owner: ec2-user
        group: ec2-user
        mode: "0644"
        content: |
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          networking:
            apiServerAddress: "0.0.0.0"
            apiServerPort: 6443
          nodes:
            - role: control-plane
              kubeadmConfigPatches:
                - |
                  kind: InitConfiguration
                  nodeRegistration:
                    kubeletExtraArgs:
                      node-labels: "ingress-ready=true"
              extraPortMappings:
                - { containerPort: 80,  hostPort: 80,  protocol: TCP }
                - { containerPort: 443, hostPort: 443, protocol: TCP }

    # =========================================================================
    # 6) Cluster kind — como root
    # =========================================================================
    - name: Verificar se o cluster kind já existe
      become: true
      command: /usr/local/bin/kind get clusters
      register: kind_clusters
      failed_when: false
      changed_when: false

    - name: Criar cluster kind
      become: true
      command: >
        /usr/local/bin/kind create cluster
        --name {{ kind_cluster_name }}
        --config /home/ec2-user/kind-config.yaml
      when: kind_cluster_name not in kind_clusters.stdout

    - name: Aguardar o nó ficar Ready
      become: true
      command: /usr/local/bin/kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false

    # =========================================================================
    # 7) ingress-nginx
    # =========================================================================
    - name: Aplicar manifest do ingress-nginx (kind)
      become: true
      command: >
        /usr/local/bin/kubectl apply -f
        https://raw.githubusercontent.com/kubernetes/ingress-nginx/main/deploy/static/provider/kind/deploy.yaml

    - name: Aguardar ingress-nginx
      become: true
      command: >
        /usr/local/bin/kubectl wait --namespace ingress-nginx
        --for=condition=ready pod
        --selector=app.kubernetes.io/component=controller
        --timeout=240s
      changed_when: false

    # =========================================================================
    # 8) Namespaces
    # =========================================================================
    - name: Criar namespaces do lab
      become: true
      command: /usr/local/bin/kubectl create ns {{ item }}
      register: ns_create
      failed_when: >
        ns_create.rc != 0 and
        'already exists' not in (ns_create.stderr | default(''))
      changed_when: ns_create.rc == 0
      loop:
        - rolling
        - blue-green

    # =========================================================================
    # 9) Copiar kubeconfig para o ec2-user
    # =========================================================================
    - name: Criar diretório .kube do ec2-user
      become: true
      file:
        path: /home/ec2-user/.kube
        state: directory
        owner: ec2-user
        group: ec2-user
        mode: "0700"

    - name: Copiar kubeconfig do root para o ec2-user
      become: true
      copy:
        src: /root/.kube/config
        dest: /home/ec2-user/.kube/config
        remote_src: true
        owner: ec2-user
        group: ec2-user
        mode: "0600"

    # =========================================================================
    # 10) Log final
    # =========================================================================
    - name: Mostrar nodes
      become: true
      command: /usr/local/bin/kubectl get nodes -o wide
      register: nodes_out
      changed_when: false

    - name: Output nodes
      debug:
        msg: "{{ nodes_out.stdout_lines }}"
