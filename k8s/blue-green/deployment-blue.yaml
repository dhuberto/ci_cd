# =============================================================================
# deployment-blue.yaml — slot BLUE
# =============================================================================
# APP_COLOR=blue faz a interface ficar azul quando o slot está ativo.
# labels slot=blue casam com o Service todolist-blue e com o selector
# do Service todolist-active (durante o switch).
#
# serviceAccountName: todolist-sa — identidade para a rota /pods.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todolist-blue
  namespace: blue-green
  labels:
    app: todolist
    slot: blue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todolist
      slot: blue
  template:
    metadata:
      labels:
        app: todolist
        slot: blue
    spec:
      # ServiceAccount para a rota /pods consultar a API do k8s.
      serviceAccountName: todolist-sa
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
          env:
            - name: APP_NAME
              value: "TodoList Blue"
            - name: APP_COLOR
              value: "blue"
            - name: APP_PORT
              value: "5000"
            - name: SESSION_KEY
              value: "blue-session-key"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
